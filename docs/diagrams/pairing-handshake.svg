<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 628" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="320" y1="550" x2="776" y2="550">
      <stop offset="0" stop-color="#a855f7"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="blu" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#3b82f6"/></marker>
    <marker id="grn" markerWidth="11" markerHeight="11" refX="7" refY="5.5" orient="auto"><path d="M0,0 L9,5.5 L0,11 Z" fill="#22c55e"/></marker>
    <marker id="gry" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="628" rx="18" fill="#0b0e14"/>

  <text x="60" y="50" fill="#e7ecf3" font-size="26" font-weight="700">Montogo — Pairing &amp; Handshake</text>
  <text x="60" y="76" fill="#8b96a8" font-size="14">The code proves identity; a throwaway ECDH gives the video key. Every handshake message is HMAC-authenticated.</text>

  <!-- actors + lifelines -->
  <rect x="248" y="100" width="144" height="44" rx="10" fill="#141925" stroke="#262d3d"/>
  <text x="320" y="127" fill="#e7ecf3" font-size="14" font-weight="700" text-anchor="middle">WINDOWS PC</text>
  <rect x="708" y="100" width="144" height="44" rx="10" fill="#141925" stroke="#262d3d"/>
  <text x="780" y="127" fill="#e7ecf3" font-size="14" font-weight="700" text-anchor="middle">MACBOOK</text>
  <line x1="320" y1="144" x2="320" y2="612" stroke="#2f384b" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="780" y1="144" x2="780" y2="612" stroke="#2f384b" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- shared secret -->
  <rect x="250" y="158" width="600" height="44" rx="10" fill="#12161f" stroke="#2a3550"/>
  <text x="550" y="178" fill="#c9d3e0" font-size="12.5" font-weight="600" text-anchor="middle">Both sides derive  authKey = HKDF-SHA256(13-char code)</text>
  <text x="550" y="194" fill="#8b96a8" font-size="11" text-anchor="middle">code shown on Windows · typed on the Mac once</text>

  <!-- Mac: ephemeral key -->
  <rect x="640" y="218" width="280" height="32" rx="9" fill="#1b2231" stroke="#2f384b"/>
  <text x="780" y="238" fill="#e7ecf3" font-size="12" text-anchor="middle">generates ephemeral P-256 key</text>

  <!-- msg 1: request Mac -> Windows -->
  <text x="550" y="276" fill="#e7ecf3" font-size="12.5" font-weight="600" text-anchor="middle">① HandshakeRequest</text>
  <text x="550" y="294" fill="#8b96a8" font-size="11" text-anchor="middle">clientId · macPubKey · HMAC(authKey)</text>
  <line x1="780" y1="304" x2="322" y2="304" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#blu)"/>

  <!-- Windows process -->
  <rect x="150" y="322" width="360" height="44" rx="9" fill="#1b2231" stroke="#2f384b"/>
  <text x="330" y="341" fill="#e7ecf3" font-size="11.5" text-anchor="middle">② verify HMAC · generate ephemeral P-256</text>
  <text x="330" y="357" fill="#8b96a8" font-size="11" text-anchor="middle">ECDH(winPriv, macPub) → session key + feedback key</text>

  <!-- msg 2: response Windows -> Mac -->
  <text x="550" y="390" fill="#e7ecf3" font-size="12.5" font-weight="600" text-anchor="middle">③ HandshakeResponse</text>
  <text x="550" y="408" fill="#8b96a8" font-size="11" text-anchor="middle">display · winPubKey · noncePrefix · HMAC(authKey ‖ macPubKey)</text>
  <line x1="320" y1="418" x2="778" y2="418" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#blu)"/>

  <!-- Mac process -->
  <rect x="590" y="436" width="360" height="44" rx="9" fill="#1b2231" stroke="#2f384b"/>
  <text x="770" y="455" fill="#e7ecf3" font-size="11.5" text-anchor="middle">④ verify HMAC (binds our key)</text>
  <text x="770" y="471" fill="#8b96a8" font-size="11" text-anchor="middle">ECDH(macPriv, winPub) → same session key</text>

  <!-- established -->
  <line x1="250" y1="501" x2="850" y2="501" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 5"/>
  <rect x="424" y="488" width="252" height="26" rx="13" fill="#0b0e14" stroke="#22c55e"/>
  <text x="550" y="505" fill="#22c55e" font-size="11" font-weight="600" text-anchor="middle">session key ready · forward secrecy</text>

  <!-- video -->
  <text x="550" y="536" fill="#e7ecf3" font-size="12.5" font-weight="600" text-anchor="middle">Encrypted HEVC video · AES-256-GCM</text>
  <line x1="320" y1="550" x2="776" y2="550" stroke="url(#flow)" stroke-width="5" marker-end="url(#grn)"/>

  <!-- feedback -->
  <text x="550" y="584" fill="#8b96a8" font-size="12" text-anchor="middle">Authenticated link-quality feedback</text>
  <line x1="780" y1="598" x2="324" y2="598" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gry)"/>

</svg>
