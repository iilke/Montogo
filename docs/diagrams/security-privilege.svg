<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#ef4444"/></marker>
    <marker id="arAmber" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#f59e0b"/></marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#8b96a8"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" rx="18" fill="#0b0e14"/>

  <!-- title + legend -->
  <text x="60" y="50" fill="#e7ecf3" font-size="26" font-weight="700">Montogo — Security &amp; Privilege Boundary</text>
  <text x="60" y="76" fill="#8b96a8" font-size="14">The network-facing app runs unprivileged; only a tiny helper is elevated — least privilege.</text>
  <circle cx="812" cy="40" r="5" fill="#22c55e"/><text x="823" y="44" fill="#8b96a8" font-size="12">non-admin</text>
  <circle cx="912" cy="40" r="5" fill="#f59e0b"/><text x="923" y="44" fill="#8b96a8" font-size="12">elevated</text>
  <circle cx="1008" cy="40" r="5" fill="#ef4444"/><text x="1019" y="44" fill="#8b96a8" font-size="12">untrusted</text>

  <!-- ===== UNTRUSTED NETWORK ===== -->
  <rect x="40" y="220" width="170" height="180" rx="16" fill="#141925" stroke="#ef4444" stroke-width="2"/>
  <path d="M125,244 l15,27 h-30 z" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round"/>
  <line x1="125" y1="256" x2="125" y2="264" stroke="#ef4444" stroke-width="2"/><circle cx="125" cy="268" r="1.2" fill="#ef4444"/>
  <text x="125" y="316" fill="#e7ecf3" font-size="15" font-weight="700" text-anchor="middle">THE NETWORK</text>
  <text x="125" y="336" fill="#8b96a8" font-size="11" text-anchor="middle">the LAN · the Mac ·</text>
  <text x="125" y="352" fill="#8b96a8" font-size="11" text-anchor="middle">anyone on the Wi-Fi</text>
  <text x="125" y="382" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">untrusted input</text>

  <!-- red arrow: untrusted → non-admin app -->
  <line x1="210" y1="310" x2="246" y2="310" stroke="#ef4444" stroke-width="3" marker-end="url(#arRed)"/>

  <!-- ===== NON-ADMIN APP ===== -->
  <rect x="250" y="120" width="430" height="400" rx="20" fill="#141925" stroke="#22c55e" stroke-width="2"/>
  <circle cx="279" cy="141" r="7" fill="none" stroke="#22c55e" stroke-width="2"/>
  <path d="M269,159 a10,10 0 0 1 20,0" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="150" fill="#e7ecf3" font-size="19" font-weight="700">Montogo.App</text>
  <text x="300" y="170" fill="#22c55e" font-size="12.5">NON-ADMIN · runs at your user level</text>

  <g font-size="15" fill="#e7ecf3">
    <rect x="270" y="192" width="390" height="58" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="290" y="218" font-weight="600">Receive &amp; parse UDP</text>
    <text x="290" y="238" font-size="11.5" fill="#8b96a8">attacker-reachable bytes enter here</text>

    <rect x="270" y="260" width="390" height="58" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="290" y="286" font-weight="600">Decrypt + authenticate</text>
    <text x="290" y="306" font-size="11.5" fill="#8b96a8">AES-256-GCM · HMAC — forged packets dropped</text>

    <rect x="270" y="328" width="390" height="58" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="290" y="354" font-weight="600">Reassemble · FEC · adaptive bitrate</text>
    <text x="290" y="374" font-size="11.5" fill="#8b96a8">all packet handling lives here</text>

    <rect x="270" y="396" width="390" height="58" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="290" y="422" font-weight="600">Capture · HEVC encode · tray UI</text>
    <text x="290" y="442" font-size="11.5" fill="#8b96a8">the rest of the app</text>
  </g>

  <!-- ===== UAC BOUNDARY ===== -->
  <line x1="740" y1="132" x2="740" y2="512" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- app → helper control arrow (carries only 4 integers) -->
  <line x1="680" y1="250" x2="800" y2="250" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <rect x="686" y="236" width="108" height="30" rx="15" fill="#0b0e14" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="740" y="255" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">UAC · once</text>

  <!-- ===== ADMIN HELPER ===== -->
  <rect x="800" y="155" width="352" height="205" rx="20" fill="#141925" stroke="#f59e0b" stroke-width="2"/>
  <path d="M822,182 v-14 l9,-4 l9,4 v14 q0,7 -9,11 q-9,-4 -9,-11 z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
  <text x="852" y="180" fill="#e7ecf3" font-size="17" font-weight="700">Montogo.DriverHelper</text>
  <text x="852" y="199" fill="#f59e0b" font-size="12">ADMIN · elevated · ~40 lines</text>

  <g font-size="14.5" fill="#e7ecf3">
    <rect x="818" y="216" width="316" height="42" rx="11" fill="#1b2231" stroke="#2f384b"/>
    <text x="836" y="242" font-weight="600">No network · no listening socket</text>

    <rect x="818" y="264" width="316" height="42" rx="11" fill="#1b2231" stroke="#2f384b"/>
    <text x="836" y="290" font-weight="600">Input: 4 integers (w · h · fps · pid)</text>

    <rect x="818" y="312" width="316" height="42" rx="11" fill="#1b2231" stroke="#2f384b"/>
    <text x="836" y="338" font-weight="600">Output: add / remove one monitor</text>
  </g>

  <!-- helper → driver pipe -->
  <line x1="976" y1="360" x2="976" y2="392" stroke="#8b96a8" stroke-width="2" marker-end="url(#arGrey)"/>
  <text x="990" y="381" fill="#8b96a8" font-size="11">Add / RemoveAll (JSON)</text>

  <rect x="800" y="394" width="352" height="62" rx="14" fill="#1b2231" stroke="#2f384b"/>
  <text x="820" y="420" fill="#e7ecf3" font-size="14.5" font-weight="600">\\.\pipe\virtualdisplaydriver</text>
  <text x="820" y="440" fill="#8b96a8" font-size="11.5">admin-only · virtual-display-rs v0.3.1 driver</text>

  <!-- footer -->
  <text x="600" y="556" fill="#7c8496" font-size="12.5" font-weight="600" text-anchor="middle">The single UAC prompt is the trust boundary — untrusted input never reaches elevated code.</text>
  <text x="600" y="578" fill="#5b6473" font-size="11.5" text-anchor="middle">Worst case, a bug in the network path is a user-level problem; elevation only ever buys "add / remove a virtual monitor."</text>
</svg>
