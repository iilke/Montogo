<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="690" rx="18" fill="#0b0e14"/>

  <!-- title -->
  <text x="60" y="52" fill="#e7ecf3" font-size="26" font-weight="700">Montogo — System Architecture</text>
  <text x="60" y="79" fill="#8b96a8" font-size="15">One-directional, encrypted video from a Windows PC to a MacBook second screen, over plain Wi-Fi.</text>

  <!-- ===== WINDOWS PANEL ===== -->
  <rect x="50" y="110" width="350" height="505" rx="20" fill="#141925" stroke="#262d3d"/>
  <rect x="74" y="140" width="42" height="28" rx="3" fill="none" stroke="#e7ecf3" stroke-width="2.5"/>
  <rect x="90" y="168" width="10" height="7" fill="#e7ecf3"/>
  <rect x="80" y="175" width="30" height="3" rx="1.5" fill="#e7ecf3"/>
  <text x="130" y="152" fill="#e7ecf3" font-size="19" font-weight="700">WINDOWS PC</text>
  <text x="130" y="172" fill="#8b96a8" font-size="12.5">C# / .NET · capture · encode · encrypt</text>

  <g font-size="15" fill="#e7ecf3">
    <rect x="70" y="200" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="90" y="227" font-weight="600">Virtual display</text>
    <text x="90" y="248" font-size="12" fill="#8b96a8">1920×1080 @ 60 Hz · virtual-display-rs v0.3.1</text>

    <rect x="70" y="280" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="90" y="307" font-weight="600">DXGI capture</text>
    <text x="90" y="328" font-size="12" fill="#8b96a8">Desktop Duplication · BGRA + cursor · fps-capped</text>

    <rect x="70" y="360" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="90" y="387" font-weight="600">HEVC encode</text>
    <text x="90" y="408" font-size="12" fill="#8b96a8">hardware MFT · NVENC / Quick Sync / AMF · CBR</text>

    <rect x="70" y="440" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="90" y="467" font-weight="600">Chunk · protect · seal</text>
    <text x="90" y="488" font-size="12" fill="#8b96a8">≤1400 B · Reed–Solomon FEC · AES-256-GCM</text>

    <rect x="70" y="520" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="90" y="547" font-weight="600">UDP send</text>
    <text x="90" y="568" font-size="12" fill="#8b96a8">single socket · header authenticated (AAD)</text>
  </g>

  <!-- ===== MAC PANEL ===== -->
  <rect x="800" y="110" width="350" height="505" rx="20" fill="#141925" stroke="#262d3d"/>
  <path d="M824,166 l6,-24 h30 l6,24 z" fill="none" stroke="#e7ecf3" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="818" y="166" width="54" height="6" rx="3" fill="#e7ecf3"/>
  <text x="884" y="152" fill="#e7ecf3" font-size="19" font-weight="700">MACBOOK</text>
  <text x="884" y="172" fill="#8b96a8" font-size="12.5">Swift · receive · decrypt · decode · render</text>

  <g font-size="15" fill="#e7ecf3">
    <rect x="820" y="200" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="840" y="227" font-weight="600">UDP receive</text>
    <text x="840" y="248" font-size="12" fill="#8b96a8">single socket</text>

    <rect x="820" y="280" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="840" y="307" font-weight="600">Decrypt + authenticate</text>
    <text x="840" y="328" font-size="12" fill="#8b96a8">AES-256-GCM open · header as AAD</text>

    <rect x="820" y="360" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="840" y="387" font-weight="600">Reassemble + FEC recover</text>
    <text x="840" y="408" font-size="12" fill="#8b96a8">order chunks · rebuild losses from RS parity</text>

    <rect x="820" y="440" width="310" height="64" rx="12" fill="#1b2231" stroke="#2f384b"/>
    <text x="840" y="467" font-weight="600">HEVC decode</text>
    <text x="840" y="488" font-size="12" fill="#8b96a8">VideoToolbox (hardware) · strict order</text>

    <rect x="820" y="520" width="310" height="64" rx="12" fill="url(#screen)" stroke="#2f384b"/>
    <text x="840" y="547" font-weight="700" fill="#0b0e14">Metal render → second screen</text>
    <text x="840" y="568" font-size="12" fill="#0b0e14" opacity="0.85">YCbCr→RGB on GPU · vsync 60 · full-screen</text>
  </g>

  <!-- ===== CENTER: session setup + the two channels ===== -->
  <!-- session setup note -->
  <rect x="412" y="250" width="376" height="58" rx="12" fill="#12161f" stroke="#2a3550"/>
  <text x="600" y="273" fill="#c9d3e0" font-size="12.5" font-weight="600" text-anchor="middle">Session setup — authenticated ephemeral P-256 ECDH</text>
  <text x="600" y="293" fill="#8b96a8" font-size="12" text-anchor="middle">→ per-session AES-256-GCM key · forward secrecy</text>

  <!-- video flow (Windows → Mac) -->
  <text x="600" y="352" fill="#e7ecf3" font-size="14.5" font-weight="700" text-anchor="middle">Encrypted HEVC · AES-256-GCM</text>
  <rect x="410" y="366" width="360" height="20" rx="10" fill="url(#flow)"/>
  <path d="M770,358 l26,18 l-26,18 z" fill="#22c55e"/>
  <text x="600" y="404" fill="#8b96a8" font-size="12" text-anchor="middle">one-directional video · UDP · Wi-Fi / LAN</text>

  <!-- feedback (Mac → Windows) -->
  <text x="600" y="446" fill="#8b96a8" font-size="12.5" text-anchor="middle">Link-quality feedback · authenticated</text>
  <line x1="790" y1="462" x2="416" y2="462" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M416,462 l26,-9 v18 z" fill="#64748b"/>
  <text x="600" y="482" fill="#5b6473" font-size="11.5" text-anchor="middle">loss reports + keyframe requests → adaptive bitrate</text>

  <!-- footer -->
  <text x="600" y="648" fill="#7c8496" font-size="12.5" text-anchor="middle" font-weight="600">No cloud · no server · no account — two apps on one LAN, paired once with a short code.</text>
  <text x="600" y="670" fill="#5b6473" font-size="11.5" text-anchor="middle">The Mac is a passive screen: keyboard, mouse, and audio stay on the Windows PC.</text>
</svg>
